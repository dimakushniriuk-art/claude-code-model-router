<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="3 · Brief compatto → diviso tra gli agenti">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9c9c9c"/></marker></defs>
<rect width="900" height="300" rx="16" fill="#0d1117"/>
<text x="32" y="44" font-size="11" font-weight="600" fill="#9c9c9c" text-anchor="start">LA TUA RICHIESTA</text>
<text x="32" y="70" font-size="17" font-weight="600" fill="#efefef" text-anchor="start">“rendi più sicuri gli account utente”</text>
<rect x="24" y="96" width="276" height="160" rx="16" fill="#161b22" stroke="#30363d"/>
<line x1="302" y1="176" x2="316" y2="176" stroke="#9c9c9c" stroke-width="2" marker-end="url(#a)"/>
<rect x="318" y="96" width="276" height="160" rx="16" fill="#161b22" stroke="#30363d"/>
<line x1="596" y1="176" x2="610" y2="176" stroke="#9c9c9c" stroke-width="2" marker-end="url(#a)"/>
<rect x="612" y="96" width="276" height="160" rx="16" fill="#161b22" stroke="#30363d"/>
<text x="42" y="126" font-size="14" font-weight="700" fill="#efefef" text-anchor="start">1 · Prima guarda il codice</text>
<rect x="42" y="146" width="240" height="34" rx="8" fill="#1f262e"/>
<text x="54" y="168" font-size="12" font-weight="400" fill="#efefef" text-anchor="start" font-family="SFMono-Regular,Menlo,Consolas,monospace">grep password app/</text>
<text x="42" y="208" font-size="12.5" font-weight="400" fill="#9c9c9c" text-anchor="start">trova app/users.py, password in chiaro</text>
<text x="336" y="126" font-size="12.5" font-weight="700" fill="#efefef" text-anchor="start">2 · Chiede solo ciò che cambia il risultato</text>
<text x="336" y="154" font-size="13" font-weight="600" fill="#9c9c9c" text-anchor="start">Ambito?</text>
<rect x="336" y="168" width="240" height="30" rx="8" fill="#0d1117" stroke="#e76624" stroke-width="2"/>
<text x="346" y="188" font-size="11.5" font-weight="600" fill="#efefef" text-anchor="start">Hash + validazione (Consigliato)</text>
<rect x="336" y="206" width="240" height="30" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
<text x="346" y="226" font-size="11.5" font-weight="400" fill="#efefef" text-anchor="start">Anche 2FA e blocco</text>
<text x="630" y="126" font-size="12" font-weight="700" fill="#efefef" text-anchor="start">3 · Brief compatto → diviso tra gli agenti</text>
<text x="630" y="150" font-size="10.5" font-weight="700" fill="#e76624" text-anchor="start" font-family="SFMono-Regular,Menlo,Consolas,monospace">OBIETTIVO</text>
<text x="630" y="163" font-size="12" font-weight="400" fill="#efefef" text-anchor="start">hash password, validare input</text>
<text x="630" y="177" font-size="10.5" font-weight="700" fill="#e76624" text-anchor="start" font-family="SFMono-Regular,Menlo,Consolas,monospace">FATTO QUANDO</text>
<text x="630" y="190" font-size="12" font-weight="400" fill="#efefef" text-anchor="start">test ok, niente in chiaro</text>
<text x="630" y="204" font-size="10.5" font-weight="700" fill="#e76624" text-anchor="start" font-family="SFMono-Regular,Menlo,Consolas,monospace">FUORI AMBITO</text>
<text x="630" y="217" font-size="12" font-weight="400" fill="#efefef" text-anchor="start">2FA, sessioni</text>
<text x="630" y="231" font-size="10.5" font-weight="700" fill="#e76624" text-anchor="start" font-family="SFMono-Regular,Menlo,Consolas,monospace">PASSI</text>
<text x="630" y="244" font-size="12" font-weight="400" fill="#efefef" text-anchor="start">1 coder: users.py + test</text>
<text x="32" y="284" font-size="13" font-weight="400" fill="#9c9c9c" text-anchor="start">Poche centinaia di token all'inizio, così il lavoro costoso si fa una volta sola, sull'obiettivo giusto</text>
</svg>