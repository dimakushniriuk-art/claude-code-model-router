<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Install in three steps">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9c9c9c"/></marker></defs>
<rect width="900" height="210" rx="16" fill="#0d1117"/>
<rect x="24" y="20" width="276" height="172" rx="16" fill="#161b22" stroke="#30363d"/>
<circle cx="60" cy="56" r="18" fill="#00a888"/>
<text x="60" y="62" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="90" y="63" font-size="19" font-weight="700" fill="#efefef" text-anchor="start">Add</text>
<rect x="40" y="88" width="244" height="88" rx="10" fill="#1f262e"/>
<text x="52" y="112" font-size="11.5" font-weight="400" fill="#efefef" text-anchor="start" font-family="SFMono-Regular,Menlo,Consolas,monospace">claude plugin marketplace add</text>
<text x="52" y="134" font-size="11.5" font-weight="400" fill="#efefef" text-anchor="start" font-family="SFMono-Regular,Menlo,Consolas,monospace">dimakushniriuk-art/</text>
<text x="52" y="156" font-size="11.5" font-weight="400" fill="#efefef" text-anchor="start" font-family="SFMono-Regular,Menlo,Consolas,monospace">claude-code-model-router</text>
<line x1="302" y1="95" x2="316" y2="95" stroke="#9c9c9c" stroke-width="2" marker-end="url(#a)"/>
<rect x="318" y="20" width="276" height="172" rx="16" fill="#161b22" stroke="#30363d"/>
<circle cx="354" cy="56" r="18" fill="#00a888"/>
<text x="354" y="62" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="384" y="63" font-size="19" font-weight="700" fill="#efefef" text-anchor="start">Install</text>
<rect x="334" y="88" width="244" height="88" rx="10" fill="#1f262e"/>
<text x="346" y="112" font-size="11.5" font-weight="400" fill="#efefef" text-anchor="start" font-family="SFMono-Regular,Menlo,Consolas,monospace">claude plugin install</text>
<text x="346" y="134" font-size="11.5" font-weight="400" fill="#efefef" text-anchor="start" font-family="SFMono-Regular,Menlo,Consolas,monospace">model-router@model-router</text>
<line x1="596" y1="95" x2="610" y2="95" stroke="#9c9c9c" stroke-width="2" marker-end="url(#a)"/>
<rect x="612" y="20" width="276" height="172" rx="16" fill="#161b22" stroke="#30363d"/>
<circle cx="648" cy="56" r="18" fill="#00a888"/>
<text x="648" y="62" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="678" y="63" font-size="19" font-weight="700" fill="#efefef" text-anchor="start">Use Sonnet</text>
<rect x="628" y="88" width="244" height="88" rx="10" fill="#1f262e"/>
<text x="640" y="112" font-size="11.5" font-weight="400" fill="#efefef" text-anchor="start" font-family="SFMono-Regular,Menlo,Consolas,monospace">/model sonnet</text>
<text x="640" y="134" font-size="11.5" font-weight="400" fill="#efefef" text-anchor="start" font-family="SFMono-Regular,Menlo,Consolas,monospace">then restart Claude Code</text>
</svg>