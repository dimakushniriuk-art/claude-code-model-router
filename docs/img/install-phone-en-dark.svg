<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="On a phone (Claude app → Code)">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9c9c9c"/></marker></defs>
<rect width="900" height="400" rx="16" fill="#0d1117"/>
<text x="32" y="44" font-size="20" font-weight="700" fill="#efefef" text-anchor="start">On a phone (Claude app → Code)</text>
<circle cx="52" cy="92" r="18" fill="#00a888"/>
<text x="52" y="98" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="82" y="98" font-size="14.5" font-weight="600" fill="#efefef" text-anchor="start">Open Code and pick your repository</text>
<line x1="52" y1="114" x2="52" y2="148" stroke="#30363d" stroke-width="2"/>
<circle cx="52" cy="170" r="18" fill="#00a888"/>
<text x="52" y="176" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="82" y="176" font-size="14.5" font-weight="600" fill="#efefef" text-anchor="start">Send this message</text>
<line x1="52" y1="192" x2="52" y2="226" stroke="#30363d" stroke-width="2"/>
<circle cx="52" cy="248" r="18" fill="#00a888"/>
<text x="52" y="254" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="82" y="254" font-size="14.5" font-weight="600" fill="#efefef" text-anchor="start">Next sessions on that repo use the agents</text>
<text x="82" y="274" font-size="12.5" font-weight="400" fill="#9c9c9c" text-anchor="start">Then type /model sonnet in a session</text>
<rect x="520" y="58" width="340" height="320" rx="28" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<rect x="660.0" y="68" width="60" height="6" rx="3" fill="#30363d"/>
<text x="540" y="102" font-size="12" font-weight="600" fill="#9c9c9c" text-anchor="start">Code · your-repo</text>
<rect x="540" y="116" width="300" height="115" rx="14" fill="#1f262e" stroke="#00a888"/>
<text x="552" y="140" font-size="10.5" font-weight="400" fill="#efefef" text-anchor="start" font-family="SFMono-Regular,Menlo,Consolas,monospace">Install model-router in this repo:</text>
<text x="552" y="159" font-size="10.5" font-weight="400" fill="#efefef" text-anchor="start" font-family="SFMono-Regular,Menlo,Consolas,monospace">git clone --depth 1 https://github.com/</text>
<text x="552" y="178" font-size="10.5" font-weight="400" fill="#efefef" text-anchor="start" font-family="SFMono-Regular,Menlo,Consolas,monospace">dimakushniriuk-art/claude-code-model-router</text>
<text x="552" y="197" font-size="10.5" font-weight="400" fill="#efefef" text-anchor="start" font-family="SFMono-Regular,Menlo,Consolas,monospace">/tmp/mr &amp;&amp; bash /tmp/mr/install.sh --project</text>
<text x="552" y="216" font-size="10.5" font-weight="400" fill="#efefef" text-anchor="start" font-family="SFMono-Regular,Menlo,Consolas,monospace">then commit and push.</text>
<rect x="540" y="330" width="300" height="32" rx="16" fill="#0d1117" stroke="#30363d"/>
<circle cx="822" cy="346" r="11" fill="#00a888"/>
<path d="M817,346 L827,346 M823,342 L827,346 L823,350" stroke="#ffffff" stroke-width="2" fill="none"/>
<text x="32" y="316" font-size="12" font-weight="400" fill="#9c9c9c" text-anchor="start">Why: plugins installed on a computer don't load in phone/web</text>
<text x="32" y="334" font-size="12" font-weight="400" fill="#9c9c9c" text-anchor="start">sessions (official docs). This puts the agents inside your</text>
<text x="32" y="352" font-size="12" font-weight="400" fill="#9c9c9c" text-anchor="start">repository instead.</text>
</svg>